<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web IoT Sederhana</title>
    <!-- Memuat library MQTT JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; margin: 20px auto; width: 300px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; border: none; border-radius: 5px; }
        .btn-on { background: #4CAF50; color: white; }
        .btn-off { background: #f44336; color: white; }
    </style>
</head>
<body>

    <h2>Dashboard IoT ESP32</h2>

    <!-- Kotak untuk Status Sensor -->
    <div class="card">
        <h3>Suhu Ruangan</h3>
        <h1 id="nilaiSuhu">--</h1> <span>°C</span>
    </div>

    <!-- Kotak untuk Kontrol Aktuator (LED) -->
    <div class="card">
        <h3>Kontrol LED</h3>
        <button class="btn-on" onclick="kirimPerintah('ON')">HIDUPKAN</button>
        <button class="btn-off" onclick="kirimPerintah('OFF')">MATIKAN</button>
    </div>

<script>
    // Konfigurasi koneksi MQTT di Web (menggunakan WebSocket port dari broker HiveMQ)
    const host = "broker.hivemq.com";
    const port = 8000; // Port WebSocket HiveMQ
    const clientId = "web_client_" + parseInt(Math.random() * 100000);

    client = new Paho.MQTT.Client(host, Number(port), clientId);

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    client.connect({onSuccess: onConnect});

    function onConnect() {
        console.log("Terhubung ke MQTT Broker!");
        client.subscribe("projekku/suhu"); // Berlangganan topik suhu
    }

    function onConnectionLost(responseObject) {
        if (responseObject.errorCode !== 0) {
            console.log("Koneksi terputus: " + responseObject.errorMessage);
        }
    }

    // Fungsi saat data masuk dari ESP32
    function onMessageArrived(message) {
        if (message.destinationName === "projekku/suhu") {
            document.getElementById("nilaiSuhu").innerHTML = message.payloadString;
        }
    }

    // Fungsi untuk mengirim perintah tombol ke ESP32
    function kirimPerintah(perintah) {
        message = new Paho.MQTT.Message(perintah);
        message.destinationName = "projekku/led";
        client.send(message);
    }
</script>

</body>
</html>
